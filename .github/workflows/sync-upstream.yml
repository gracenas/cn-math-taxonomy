# 每天把上游 main 合并进 fork，构建后直传到 Cloudflare Pages（Direct Upload）。
# 当前 Pages 项目是直传模式、不连 Git，所以这里显式跑 build-pages.sh + pages deploy。
#
# 首次使用（必做）：
#   1. fork 仓库 Settings > Actions > General 允许 Actions 运行；
#   2. fork 仓库 Settings > Secrets and variables > Actions 添加两个 Secret：
#        CLOUDFLARE_API_TOKEN  = Cloudflare API Token（含 Cloudflare Pages:Edit 权限）
#        CLOUDFLARE_ACCOUNT_ID = eccd08736e2e144618db1d59c426ef01
#   3. Actions 页面手动 Run workflow 一次验证。
#
# 时间：每天 UTC 04:23（北京时间 12:23）。想改频率改下面的 cron 即可。

name: Sync upstream & deploy to Pages

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-and-deploy
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_ORIGIN: https://edu.gracesite.top
      API_BASE: https://gracenas-math-api.nfshare201902.workers.dev
      NODE_VERSION: '22'
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream/main into fork/main
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/xiaoyang111222/cn-math-taxonomy.git
          git fetch upstream main --no-tags
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "上游无新提交，fork 已是最新"
          else
            # fork 相对上游只新增文件（脚本/workflow/配置），不改上游文件，合并无冲突。
            git merge --no-edit upstream/main
            git push origin main
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build static site
        # 构建产物 dist/ 含域名与 API 地址替换、4221 个知识点页、sitemap、_headers
        run: bash scripts/build-pages.sh

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.86.0 pages deploy dist --project-name=gracenas-cn-math-taxonomy --branch=main --commit-dirty=true

      - name: Summary
        run: echo "部署完成 -> https://edu.gracesite.top"
